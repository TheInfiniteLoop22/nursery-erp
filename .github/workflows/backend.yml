name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

# Least privilege for the default GITHUB_TOKEN; superseded PR runs are cancelled, deploys never are.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_test
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run API tests
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t erp-backend:ci .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker]
    # Enabled by setting the repo variable RENDER_DEPLOY_ENABLED=true (needs the RENDER_API_KEY secret).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
    environment: production
    defaults:
      run:
        working-directory: .
    steps:
      - name: Deploy on Render and wait until live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY secret is not set"; exit 1; }
          test -n "$SERVICE_ID" || { echo "RENDER_BACKEND_SERVICE_ID variable is not set"; exit 1; }
          deploy_id=$(curl --fail -sS -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys"             -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" -d '{}'             | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Render deploy id: $deploy_id"
          for i in $(seq 1 90); do
            status=$(curl --fail -sS "https://api.render.com/v1/services/$SERVICE_ID/deploys/$deploy_id"               -H "Authorization: Bearer $RENDER_API_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "[$i] $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for the deploy"; exit 1

      - name: Smoke test backend health
        env:
          BASE_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: curl --fail -sS --retry 12 --retry-delay 10 --retry-all-errors "$BASE_URL/health"
